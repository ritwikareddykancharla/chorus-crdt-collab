<svg viewBox="0 0 1220 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChorusCRDT System Architecture Diagram">
  <defs>
    <pattern id="archDotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D4D4D8" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1220" height="730" fill="#FFFFFF" />
  <rect x="0" y="0" width="1220" height="730" fill="url(#archDotGrid)" opacity="0.68" />

  <!-- Layer 1: Browser & Serverless Edge -->
  <rect x="22" y="18" width="1176" height="148" fill="#FAFAFA" stroke="#71717A" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="36" y="42" font-family="sans-serif" font-size="16" font-weight="800" fill="#7C3AED">1. Multiplayer Browser Views &amp; Serverless AWS Edge (CloudFront + Private S3 OAC + AWS Lambda)</text>

  <rect x="40" y="56" width="200" height="84" fill="#EDE9FE" stroke="#18181B" stroke-width="2" />
  <text x="140" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#18181B">Collaborator Browsers</text>
  <text x="140" y="106" text-anchor="middle" font-family="monospace" font-size="10" fill="#4C1D95">4 Live Views + Peer Cursors</text>
  <text x="140" y="124" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">URL hash state · Dark mode</text>

  <line x1="240" y1="98" x2="300" y2="98" stroke="#18181B" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="304" y="56" width="250" height="84" fill="#FAF5FF" stroke="#18181B" stroke-width="2" />
  <text x="429" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#18181B">Amazon CloudFront</text>
  <text x="429" y="106" text-anchor="middle" font-family="monospace" font-size="10" fill="#6D28D9">Unified HTTPS Origin Router</text>
  <text x="429" y="124" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">UI -&gt; S3 OAC · /api/* -&gt; Lambda</text>

  <rect x="636" y="42" width="276" height="48" fill="#DCFCE7" stroke="#18181B" stroke-width="2" />
  <text x="774" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#18181B">Private Amazon S3 Bucket</text>
  <text x="774" y="81" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#065F46">web/index.html · BlockPublicAccess</text>

  <rect x="636" y="102" width="276" height="50" fill="#FEF3C7" stroke="#18181B" stroke-width="2" />
  <text x="774" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#18181B">AWS Lambda API</text>
  <text x="774" y="142" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#92400E">chorus_crdt/server.py · $0 Idle</text>

  <rect x="938" y="44" width="240" height="106" fill="#EDE9FE" stroke="#18181B" stroke-width="2" />
  <text x="952" y="68" font-family="sans-serif" font-size="14" font-weight="800" fill="#5B21B6">Serverless Unit Economics</text>
  <text x="952" y="90" font-family="monospace" font-size="10" fill="#18181B">• Static UI via CloudFront OAC</text>
  <text x="952" y="110" font-family="monospace" font-size="10" fill="#18181B">• 150 B median binary wire sync</text>
  <text x="952" y="130" font-family="monospace" font-size="10" font-weight="700" fill="#7C3AED">• 320 / 320 fuzz seeds converged</text>

  <!-- Layer 2: Scratch Yata Sequence CRDT -->
  <rect x="22" y="194" width="1176" height="148" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="36" y="218" font-family="sans-serif" font-size="16" font-weight="800" fill="#7C3AED">2. Scratch Yata Sequence CRDT, Relative Cursor Anchors &amp; Causal Buffers</text>

  <rect x="42" y="232" width="356" height="92" fill="#EDE9FE" stroke="#18181B" stroke-width="2" />
  <text x="220" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#4C1D95">Yata Sequence Integrator</text>
  <text x="220" y="282" text-anchor="middle" font-family="monospace" font-size="9.8" fill="#18181B">id=(actor, clock) · origin_left / right</text>
  <text x="220" y="302" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">Non-crossing rule · 0 scrambled words</text>

  <rect x="432" y="232" width="356" height="92" fill="#DBEAFE" stroke="#18181B" stroke-width="2" />
  <text x="610" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#1E3A8A">RelativeAnchor &amp; Range Resolver</text>
  <text x="610" y="282" text-anchor="middle" font-family="monospace" font-size="9.8" fill="#18181B">RelativeAnchor(item_id, before|after)</text>
  <text x="610" y="302" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">Pins AI selections across upstream edits</text>

  <rect x="822" y="232" width="356" height="92" fill="#FEF3C7" stroke="#18181B" stroke-width="2" />
  <text x="1000" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#92400E">Out-of-Order Causal Buffer</text>
  <text x="1000" y="282" text-anchor="middle" font-family="monospace" font-size="9.8" fill="#18181B">Pending inserts + LWW delete_version</text>
  <text x="1000" y="302" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#78350F">Idempotent under packet shuffle &amp; replay</text>

  <!-- Layer 3: Binary Wire Protocol & Selective Undo -->
  <rect x="22" y="374" width="1176" height="150" fill="#F0FDF4" stroke="#065F46" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="36" y="398" font-family="sans-serif" font-size="16" font-weight="800" fill="#065F46">3. Binary StateVector Delta Protocol (CHSV / CHDL) &amp; Selective Per-Actor Undo</text>

  <rect x="42" y="414" width="542" height="92" fill="#DCFCE7" stroke="#18181B" stroke-width="2" />
  <text x="313" y="442" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#18181B">LEB128 Varint StateVector &amp; RLE Delta Sync</text>
  <text x="313" y="464" text-anchor="middle" font-family="monospace" font-size="9.8" fill="#065F46">CHSV\x01 + CHDL\x01 · Actor Table + RLE Runs</text>
  <text x="313" y="484" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">99.98% smaller than full CRDT JSON snapshots</text>

  <rect x="624" y="414" width="554" height="92" fill="#FFE4E6" stroke="#18181B" stroke-width="2" />
  <text x="901" y="442" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#18181B">Selective Per-Author Transaction Undo</text>
  <text x="901" y="464" text-anchor="middle" font-family="monospace" font-size="9.8" fill="#9F1239">Inverse Tombstone + Restore Mutations</text>
  <text x="901" y="484" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3F3F46">Reverts one peer or AI edit with 0 collateral loss</text>

  <!-- Layer 4: Live Amazon Bedrock Peer & SQLite WAL Store -->
  <rect x="42" y="564" width="542" height="138" fill="#F3E8FF" stroke="#18181B" stroke-width="2.2" />
  <text x="313" y="596" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="800" fill="#5B21B6">4. Live Amazon Bedrock Co-Authoring Peer</text>
  <text x="313" y="620" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#18181B">us.amazon.nova-lite-v1:0 · Converse API</text>
  <text x="313" y="642" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#4C1D95">Edits RelativeRange spans alongside live human keystrokes</text>

  <rect x="624" y="564" width="554" height="138" fill="#FEF3C7" stroke="#18181B" stroke-width="2.2" />
  <text x="901" y="596" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="800" fill="#92400E">4. SQLite WAL Op-Log &amp; Checkpoint Compactor</text>
  <text x="901" y="620" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#18181B">chorus_oplog.db · PRAGMA journal_mode=WAL</text>
  <text x="901" y="642" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#78350F">Folds incremental binary frames into RLE checkpoints</text>
</svg>
